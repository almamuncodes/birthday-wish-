<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg1)"/>
  <circle cx="200" cy="180" r="90" fill="#ffffff" opacity="0.25"/>
  <circle cx="620" cy="340" r="120" fill="#ffffff" opacity="0.2"/>
  
  <g transform="translate(400, 210)" text-anchor="middle">
    <circle cx="0" cy="-30" r="50" fill="#ffffff" filter="url(#glow)" opacity="0.95"/>
    <text x="0" y="-15" font-size="40" text-anchor="middle">💬</text>
    
    <text x="0" y="65" fill="#ffffff" font-family="'Hind Siliguri', 'Kalpurush', sans-serif" font-size="30" font-weight="bold">
      প্রথম ফেসবুক পরিচয় (২০২৩)
    </text>
    <text x="0" y="102" fill="#ffffff" font-family="'Hind Siliguri', sans-serif" font-size="16" opacity="0.95">
      [ আপনার আসল ছবি দিন: /public/images/memory1.jpg ]
    </text>
  </g>
</svg>
